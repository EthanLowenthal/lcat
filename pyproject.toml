[project]
name = "lcat"
version = "0.1.0"
description = "Interactive terminal viewer for markdown, CSV/TSV and JSON files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ethan Lowenthal" }]
keywords = ["cli", "terminal", "tui", "markdown", "csv", "viewer"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=8.0,<9",
    "textual-image>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/EthanLowenthal/lcat"
Issues = "https://github.com/EthanLowenthal/lcat/issues"

[project.scripts]
lcat = "lcat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcat"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
